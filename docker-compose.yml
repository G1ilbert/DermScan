services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dermscan
      POSTGRES_PASSWORD: dermscan
      POSTGRES_DB: dermscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dermscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
    command: ["python", "-m", "app.worker.tasks"]

  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboard.json:/var/lib/grafana/dashboards/dermscan.json:ro

volumes:
  pgdata:
  grafana_data:
